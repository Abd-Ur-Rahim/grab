name: build apk

on:
  workflow_dispatch:
    inputs:
      repo-url:
        description: 'git clone url'
        required: true
      repo-commit:
        description: 'commit'
      repo-dir:
        description: 'dir ("/..")'
      module:
        description: 'module'
        required: true
        default: 'app'
      googleservices:
        description: 'google-services.json (content)'
      localproperties:
        description: 'local.properties (content)'
      sign:
        type: boolean
        description: 'sign apk'
        default: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: clone
        run: |
          git clone ${{ github.event.inputs.repo-url }}
          echo "projectName=$(basename -s .git ${{ github.event.inputs.repo-url }})" >> $GITHUB_ENV
        
      - name: select commit
        if: ${{ github.event.inputs.repo-commit != '' }}
        run: |
          cd ${{ env.projectName }}
          git checkout ${{ github.event.inputs.repo-commit }}
        
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - name: verify wrapper
        run: |
          cd ./${{ env.projectName }}${{ github.event.inputs.repo-dir }}
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Execute Available Build Tasks
        run: |
          cd ./${{ env.projectName }}${{ github.event.inputs.repo-dir }}
          echo "=== Available Tasks ==="
          ./gradlew tasks || true
          echo "=== Running Compile ==="
          ./gradlew assemble --layout=plain || ./gradlew build --minus-properties || echo "Bypassing errors"

      - name: Search and Locate Generated Binaries
        run: |
          echo "=== Printing structural map of all generated files ==="
          find ${{ github.workspace }} -type f -not -path '*/.*'
