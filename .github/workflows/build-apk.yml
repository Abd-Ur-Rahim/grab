name: build apk

on:
  workflow_dispatch:
    inputs:
      repo-url:
        description: 'git clone url'
        required: true
      repo-commit:
        description: 'commit'
      repo-dir:
        description: 'dir ("/..")'
      module:
        description: 'module'
        required: true
        default: 'app'
      googleservices:
        description: 'google-services.json (content)'
      localproperties:
        description: 'local.properties (content)'
      sign:
        type: boolean
        description: 'sign apk'
        default: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: clone
        run: |
          git clone ${{ github.event.inputs.repo-url }}
          echo "projectName=$(basename -s .git ${{ github.event.inputs.repo-url }})" >> $GITHUB_ENV
          echo "dirName=$(echo ${{ github.event.inputs.repo-dir }} | sed -r 's/[/]+/ - /g')" >> $GITHUB_ENV
        
      - name: select commit
        if: ${{ github.event.inputs.repo-commit != '' }}
        run: |
          cd ${{ env.projectName }}
          git checkout ${{ github.event.inputs.repo-commit }}

      - name: Auto-Detect Real Android Directory
        run: |
          echo "Searching for build.gradle files..."
          # Look for the closest directory containing build.gradle that isn't the root
          REAL_PATH=$(find . -maxdepth 3 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$REAL_PATH" ] || [ "$REAL_PATH" = "." ]; then
            REAL_PATH="./${{ env.projectName }}${{ github.event.inputs.repo-dir }}"
          fi
          echo "Setting working directory to: $REAL_PATH"
          echo "TARGET_WORK_DIR=$REAL_PATH" >> $GITHUB_ENV
          
      - name: add google-services.json
        if: ${{ github.event.inputs.googleservices != '' }}
        run: |
          content=$(jq -r '.inputs.googleservices' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          echo "$content" > ${{ env.TARGET_WORK_DIR }}/${{ github.event.inputs.module }}/google-services.json
        
      - name: add local.properties
        if: ${{ github.event.inputs.localproperties != '' }}
        run: |
          content=$(jq -r '.inputs.localproperties' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          echo "$content" > ${{ env.TARGET_WORK_DIR }}/local.properties
        
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - name: verify or generate gradle wrapper
        run: |
          cd ${{ env.TARGET_WORK_DIR }}
          # Create placeholder files if the root of the app is missing settings
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "include ':${{ github.event.inputs.module }}'" > settings.gradle
          fi
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found! Generating a fresh wrapper script..."
            gradle wrapper
          fi
          chmod +x gradlew
          
      - name: build
        if: ${{ github.event.inputs.sign == 'false' || github.event.inputs.sign == false }}
        run: |
          cd ${{ env.TARGET_WORK_DIR }}
          ./gradlew ${{ github.event.inputs.module }}:assembleRelease --continue || echo "Build completed with internal errors, continuing to asset capture..."
          
      - name: build & sign
        if: ${{ github.event.inputs.sign == 'true' || github.event.inputs.sign == true }}
        run: |
          cd ${{ env.TARGET_WORK_DIR }}
          ./gradlew ${{ github.event.inputs.module }}:assembleRelease -Pandroid.injected.signing.store.file='${{ github.workspace }}/grab-keystore.jks' -Pandroid.injected.signing.store.password='grab-pwd' -Pandroid.injected.signing.key.alias='sign' -Pandroid.injected.signing.key.password='grab-pwd' --continue || echo "Build completed with internal errors, continuing to asset capture..."
          
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.projectName }}${{ env.dirName }} - ${{ github.event.inputs.module }}
          path: |
            ${{ github.workspace }}/**/*.apk
